<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>navydev.top</title>
<style>
  :root {
    --bg: #faf9f6;
    --text: #23201c;
    --dim: #6b655c;
    --border: #e6e2da;
    --accent: #c8791f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --text: #d8d5cf;
      --dim: #8b8781;
      --border: #2a2e34;
      --accent: #e0a054;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.25rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--border); }
  li:last-child { border-bottom: 1px solid var(--border); }
  a {
    display: flex;
    gap: 1rem;
    padding: .85rem .25rem;
    color: inherit;
    text-decoration: none;
  }
  a:hover .path { color: var(--accent); }
  .path {
    width: 7rem;
    flex: none;
    color: var(--dim);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .name { flex: 1; }
</style>
</head>
<body>
<main>
  <h1>navydev.top</h1>
  <ul>
    <li><a href="/book"><span class="path">/book</span><span class="name">Lector · EPUB 阅读器 + 有声书</span></a></li>
    <li><a href="/me"><span class="path">/me</span><span class="name">个人主页</span></a></li>
    <li><a href="/rss"><span class="path">/rss</span><span class="name">RSS</span></a></li>
    <li><a href="/crabtris"><span class="path">/crabtris</span><span class="name">俄罗斯方蟹</span></a></li>
  </ul>
</main>
</body>
</html>
