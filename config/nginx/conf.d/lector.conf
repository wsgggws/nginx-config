# ============================================
# Lector —— EPUB 阅读器 + 有声书播放器
# ============================================
# 使用说明：
# 1. 把 server_name 换成实际域名
# 2. 证书路径按 letsencrypt 的实际位置改
# 3. 后端（lector-server）默认只听 127.0.0.1:8000
#
# 令牌不进 nginx：服务端自己配 LECTOR_TOKEN，nginx 只管转发。
#
# 关于代理参数：这里没有直接 include snippets/proxy-params.conf。
# 那个片段是给 WebSocket 站点用的（Connection "upgrade"），
# 而且它写死了 proxy_read_timeout 60s —— 同一个 location 里再写一次
# 就会报 "proxy_read_timeout directive is duplicate"。
# Lector 不走 WebSocket，要的是到后端的长连接与更长的超时，
# 所以下面各段把需要的几行写全。
#
# 速度上的几处讲究：
#   * HTTP/2 —— 一个连接 multiplex 全部资源，网页开得快，弱网尤其明显
#   * 静态资源（styles/ js/）走 proxy_cache，不再问后端要
#   * 到后端保持长连接（upstream keepalive + Connection ""）
#   * 音频单独一个 location：合成可能要好几秒，超时放宽、缓冲关掉
#   * 上传单独一个 location：给足时间和体积，不被掐断

upstream lector_app {
    server 127.0.0.1:8000;
    keepalive 32;              # 到后端保持长连接
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# ============================================
# HTTP → HTTPS
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name reader.example.com;

    # Let's Encrypt ACME 验证
    include /etc/nginx/snippets/letsencrypt.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS
# ============================================
server {
    # http2 走 listen 参数（nginx 1.25.1 起会提示过时，
    # 那种版本可以改成 listen 443 ssl; 加单独一行 http2 on;）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reader.example.com;

    # ========================================
    # SSL
    # ========================================
    ssl_certificate     /etc/letsencrypt/live/reader.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reader.example.com/privkey.pem;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # ========================================
    # 上传
    # ========================================
    # 应用侧上限 50MB，这里留点余量
    client_max_body_size 60m;
    client_body_timeout 120s;

    # ========================================
    # 静态资源
    # ========================================
    # 注意：Lector 的 css/js 没有带版本号，所以**不能**套
    # snippets/static-cache.conf —— 那里给 .css/.js 的是
    # immutable + 一年，前端一改浏览器还拿旧的。
    # 这里自己写：一小时 + must-revalidate，改完刷新就能拿到新的。
    location ~* ^/(styles|js)/ {
        proxy_pass http://lector_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 静态资源在 nginx 这层缓存，不再问后端
        proxy_cache            proxy_cache;
        proxy_cache_valid      200 1h;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        proxy_cache_lock       on;
        proxy_cache_revalidate on;

        # 只给一条 Cache-Control：expires 与 add_header 同时写会出两条头
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        access_log off;
    }

    # ========================================
    # 音频
    # ========================================
    # 第一次请求可能要现场合成（几秒），所以超时放宽、缓冲关掉，
    # 音频不会卡在半路。
    location ~* ^/api/v1/books/.*/audio/ {
        proxy_pass http://lector_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    # ========================================
    # 上传接口
    # ========================================
    location = /api/v1/books {
        limit_req zone=api burst=10 nodelay;
        limit_conn addr 10;

        proxy_pass http://lector_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        client_max_body_size 60m;
    }

    # ========================================
    # 其余接口
    # ========================================
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_conn addr 20;

        proxy_pass http://lector_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ========================================
    # 其余
    # ========================================
    location / {
        proxy_pass http://lector_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
