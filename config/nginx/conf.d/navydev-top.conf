# ============================================
# navydev.top —— 所有站点都在这一个域名下
# ============================================
#   /ebook  有声电子书（后端 127.0.0.1:8010）
#   /me     原 navydev.top
#   /rss    原 rss.navydev.top
#   /help   索引页
#
# 原来的子域名会 301 到新路径，老书签不会失效。
#
# nginx 1.18（Ubuntu）：HTTP/2 走 listen 参数，
# 不要用 1.25.1 才有的 `http2 on;`。

upstream ebook_app {
    # rss 的后端已经占着 8000，有声电子书用 8010
    server 127.0.0.1:8010;
    keepalive 32;              # 到后端保持长连接
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# 原 rss.navydev.top 的后端（FastAPI），仍然是 8000。
upstream rss_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name navydev.top;

    # ========================================
    # SSL
    # ========================================
    ssl_certificate     /etc/letsencrypt/live/navydev.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navydev.top/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # 上传：应用侧 50MB，这里留点余量
    client_max_body_size 60m;
    client_body_timeout 120s;

    # ========================================
    # /ebook —— 有声电子书
    # ========================================
    # 后端配了 LECTOR_BASE_PATH=/ebook，路径原样传过去，
    # 不要用 proxy_pass 带斜杠（那会把前缀吃掉）。
    # 规范路径是 /ebook（无尾斜杠）；应用本身也提供这个入口。
    location = /ebook {
        proxy_pass http://ebook_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # /blog —— Hugo 博客（GitHub Pages 同款内容的 /blog 构建）
    location = /blog {
        root /var/www/navydev.top;
        try_files /blog/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /blog/ {
        root /var/www/navydev.top;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;

        location ~* ^/blog/(scss|ts)/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/security-headers.conf;
            access_log off;
        }

        location ~* ^/blog/images/ {
            expires 30d;
            add_header Cache-Control "public";
            include /etc/nginx/snippets/security-headers.conf;
            access_log off;
        }
    }

    location /ebook/ {
        proxy_pass http://ebook_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # 原生 ES Modules 的 import 图没有指纹，不能让旧 JS 长时间驻留。
    # 每次请求都向后端校验，HTML 里的入口 URL 还带内容哈希。
    location ~* ^/ebook/(styles|js)/ {
        proxy_pass http://ebook_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    # 音频：第一次可能要现场合成，超时放宽、缓冲关掉
    location ~* ^/ebook/api/v1/books/.*/audio/ {
        proxy_pass http://ebook_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    # 上传接口
    location = /ebook/api/v1/books {
        limit_req zone=api burst=10 nodelay;
        limit_conn addr 10;

        proxy_pass http://ebook_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        client_max_body_size 60m;
    }

    # ========================================
    # /me —— 原 navydev.top（静态站点，Vite 构建）
    # ========================================
    # navydev.top 项目构建时 base=/me/，产物放在 /var/www/navydev.top/me/。
    location = /me {
        root /var/www/navydev.top;
        try_files /me/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /me/ {
        root /var/www/navydev.top;
        index index.html;
        try_files $uri $uri/ /me/index.html;

        # 带内容哈希的产物可以长期缓存；index.html 不缓存
        location ~* ^/me/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/security-headers.conf;
            access_log off;
        }
    }

    # 旧站点的随机点名页：保留老链接，内容随 /me 一起发布。
    location = /nghh {
        return 301 /me/nghh/;
    }

    location /nghh/ {
        return 301 /me/nghh/;
    }

    # ========================================
    # /rss —— 原 rss.navydev.top（前端静态 + FastAPI 后端）
    # ========================================
    location = /rss {
        root /var/www/navydev.top;
        try_files /rss/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 接口：/rss/backend/xxx → 后端 /xxx（proxy_pass 带斜杠，前缀被替换）
    location /rss/backend/ {
        proxy_pass http://rss_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location = /rss/docs {
        proxy_pass http://rss_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /rss/redoc {
        proxy_pass http://rss_api/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /rss/openapi.json {
        proxy_pass http://rss_api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 的 Swagger/ReDoc 页面默认从站点根读取 /openapi.json。
    # 该页面现在挂在 /rss/docs，因此把这个默认地址也转给 RSS 后端。
    location = /openapi.json {
        proxy_pass http://rss_api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端：rss.navydev.top 构建时 base=/rss/，产物放在 /var/www/navydev.top/rss/。
    location /rss/ {
        root /var/www/navydev.top;
        index index.html;
        try_files $uri $uri/ /rss/index.html;

        location ~* ^/rss/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/security-headers.conf;
            access_log off;
        }
    }

    # ========================================
    # /crabtris —— 原 crabtris.navydev.top
    # ========================================
    location = /crabtris {
        root /var/www;
        try_files /crabtris.navydev.top/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /crabtris/ {
        alias /var/www/crabtris.navydev.top/;
        index index.html;
    }

    # ========================================
    # / 与 /help —— 同一个索引页
    # ========================================
    location = /favicon.ico {
        return 302 /help/favicon.png;
    }

    location = / {
        root /var/www/navydev;
        try_files /help/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /help {
        root /var/www/navydev;
        try_files /help/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /help/ {
        root /var/www/navydev;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

# ============================================
# 老子域名：301 到新路径
# ============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rss.navydev.top;

    # 该子域名有独立证书；navydev.top 的证书不包含它的 SAN。
    ssl_certificate     /etc/letsencrypt/live/rss.navydev.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rss.navydev.top/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        return 301 https://navydev.top/rss$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crabtris.navydev.top obz.navydev.top;

    ssl_certificate     /etc/letsencrypt/live/navydev.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navydev.top/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
