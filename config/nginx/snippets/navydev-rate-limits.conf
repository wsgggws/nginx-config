# 在 server 级引用，子 location 统一继承；新增规则时保留整组限制。
limit_req zone=navydev_site_ip burst=100 nodelay;
limit_req zone=navydev_site_total burst=200 nodelay;
limit_req zone=navydev_backend_ip burst=15 nodelay;
limit_req zone=navydev_backend_total burst=30 nodelay;
limit_req zone=navydev_metric_ip burst=60 nodelay;
limit_req zone=navydev_metric_total burst=120 nodelay;
limit_req_status 429;
limit_req_log_level warn;

limit_conn navydev_backend_conn_ip 8;
limit_conn navydev_backend_conn_total 32;
limit_conn_status 429;
limit_conn_log_level warn;

error_page 429 $navydev_limit_target;

location @navydev_limit_page {
    root /var/www/navydev/help;
    try_files /rate-limit.html =429;
    add_header Retry-After 5 always;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
}

location @navydev_limit_api {
    default_type application/json;
    add_header Retry-After 5 always;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"访问较频繁，请稍等片刻后重试。"},"detail":"访问较频繁，请稍等片刻后重试。","retryAfterSeconds":5}';
}
