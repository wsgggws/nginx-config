<!DOCTYPE html>
<html lang="zh-CN" data-theme="luzhu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'">
<title>navydev.top</title>
<meta name="theme-color" content="#1D3229">
<link rel="icon" type="image/png" href="/help/favicon.png">
<style>
  /* LuZhu.nvim: 潭绿为底、珠白文字、碧玉强调。 */
  :root {
    color-scheme: dark;
    --bg: #1D3229;
    --surface: #243B2E;
    --glow: #293F30;
    --text: #DCE8D5;
    --dim: #AEC0AB;
    --border: #56785D;
    --accent: #89C79B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.25rem;
    background: radial-gradient(ellipse at 50% 0, var(--glow), transparent 70%), var(--bg);
    min-height: 100vh;
    color: var(--text);
    font: 16px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 40rem; margin: 0 auto; }
  .site-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0; color: var(--text); }
  .social-links { display: flex; gap: .5rem; }
  .social-links a {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--dim);
  }
  .social-links a:hover { color: var(--accent); border-color: var(--border); background: var(--surface); }
  .social-links svg { width: 22px; height: 22px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--border); }
  li a:hover { background: var(--surface); }
  li:last-child { border-bottom: 1px solid var(--border); }
  a {
    display: flex;
    gap: 1rem;
    padding: .85rem .25rem;
    color: inherit;
    text-decoration: none;
  }
  a:hover .path { color: var(--accent); }
  .path {
    width: 7rem;
    flex: none;
    color: var(--dim);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .name { flex: 1; }
</style>
</head>
<body>
<main>
  <header class="site-header">
    <h1>navydev.top</h1>
    <nav class="social-links" aria-label="社交链接">

      </a>
      <a href="https://space.bilibili.com/472722204" target="_blank" rel="noopener noreferrer" aria-label="BiliBili · navy" title="BiliBili · navy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 2 3 4m7-4-3 4"/><rect x="2" y="6" width="20" height="15" rx="4"/><path d="m7 11 2 1m8-1-2 1m-6 4 3 1 3-1"/></svg>
      </a>
    </nav>
  </header>
  <ul>

</main>

</html>
