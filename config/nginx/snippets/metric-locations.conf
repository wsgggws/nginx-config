# navydev.top_metric 的 CI 会准备页面与监控服务；此入口公开、无需密码。
location = /metric {
    return 302 /metric/;
}

location ^~ /metric/ {
    auth_basic off;
    alias /opt/navydev.top_metric/web/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/security-headers.conf;

    location = /metric/access {
        return 302 /metric/access/;
    }

    location = /metric/access/ {
        rewrite ^ /metric/access/report.html last;
    }

    location = /metric/access/report.html {
        alias /var/lib/navydev-metric/report.html;
        default_type text/html;
    }

    location = /metric/system {
        return 302 /metric/system/;
    }

    # Netdata 的相对资源与 API 路径需要保留尾斜杠。
    location ^~ /metric/system/ {
        proxy_pass http://127.0.0.1:19999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        # 同源 /metric 页面嵌入系统面板，由中央安全头统一控制。
        proxy_hide_header X-Frame-Options;
        proxy_redirect http://127.0.0.1:19999/ /metric/system/;
        proxy_read_timeout 60s;
    }
}
