# ============================================
# navydev.top —— 四个站点都在这一个域名下
# ============================================
#   /book   Lector：EPUB 阅读器 + 有声书播放器（原 reader 子域名）
#   /me     原 navydev.top
#   /rss    原 rss.navydev.top
#   /help   索引页
#
# 原来的子域名会 301 到新路径，老书签不会失效。
#
# nginx 1.18（Ubuntu）：HTTP/2 走 listen 参数，
# 不要用 1.25.1 才有的 `http2 on;`。

upstream lector_app {
    server 127.0.0.1:8000;
    keepalive 32;              # 到后端保持长连接
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# 原 navydev.top 的后端 —— 换成你原来的地址。
upstream me_app {
    server 127.0.0.1:8080;    # TODO: 换成原 navydev.top 的后端
    keepalive 16;
}

# 原 rss.navydev.top 的后端 —— 换成你原来的地址。
upstream rss_app {
    server 127.0.0.1:8081;    # TODO: 换成原 rss.navydev.top 的后端
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name navydev.top;

    # ========================================
    # SSL
    # ========================================
    ssl_certificate     /etc/letsencrypt/live/navydev.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navydev.top/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # 上传：应用侧 50MB，这里留点余量
    client_max_body_size 60m;
    client_body_timeout 120s;

    # ========================================
    # /book —— Lector
    # ========================================
    # 后端配了 LECTOR_BASE_PATH=/book，路径原样传过去，
    # 不要用 proxy_pass 带斜杠（那会把前缀吃掉）。
    location = /book {
        return 301 /book/;
    }

    location /book/ {
        proxy_pass http://lector_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # 静态资源：nginx 这层缓存，不再问后端要。
    # Lector 的 css/js 没有版本号，所以不用 immutable 长期缓存，
    # 免得前端更新了浏览器还拿旧的。
    location ~* ^/book/(styles|js)/ {
        proxy_pass http://lector_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_cache            proxy_cache;
        proxy_cache_valid      200 1h;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        proxy_cache_lock       on;
        proxy_cache_revalidate on;

        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        access_log off;
    }

    # 音频：第一次可能要现场合成，超时放宽、缓冲关掉
    location ~* ^/book/api/v1/books/.*/audio/ {
        proxy_pass http://lector_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    # 上传接口
    location = /book/api/v1/books {
        limit_req zone=api burst=10 nodelay;
        limit_conn addr 10;

        proxy_pass http://lector_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        client_max_body_size 60m;
    }

    # ========================================
    # /me —— 原 navydev.top
    # ========================================
    # 把 upstream 换成原来 navydev.top 指的后端。
    location = /me {
        return 301 /me/;
    }

    location /me/ {
        proxy_pass http://me_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # ========================================
    # /rss —— 原 rss.navydev.top
    # ========================================
    # 把 upstream 换成原来 rss.navydev.top 指的后端。
    location = /rss {
        return 301 /rss/;
    }

    location /rss/ {
        proxy_pass http://rss_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # ========================================
    # /help —— 索引页
    # ========================================
    location = /help {
        root /var/www/navydev;
        try_files /help/index.html =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = / {
        return 302 /help;
    }
}

# ============================================
# 老子域名：301 到新路径
# ============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rss.navydev.top;

    ssl_certificate     /etc/letsencrypt/live/navydev.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navydev.top/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        return 301 https://navydev.top/rss$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crabtris.navydev.top obz.navydev.top;

    ssl_certificate     /etc/letsencrypt/live/navydev.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navydev.top/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
