# ============================================
# HTTP 重定向配置 - 所有站点统一
# ============================================
# 将所有 HTTP 请求重定向到 HTTPS
#
# 站点的实际配置在 navydev-top.conf：所有站点都在 navydev.top 这一个
# 域名下，用路径区分（/ebook、/blog、/rss、/crabtris、/me、/help）。

# 明显的命令行客户端不直接暴露页面；官方终端和带 Bearer 的应用请求放行，
# 后两者仍由应用自己校验身份或来源。
map $http_user_agent $cli_user_agent {
  default 0;
  ~*(curl|wget|python-requests|httpx|httpie|postmanruntime|go-http-client|libwww-perl) 1;
}

map $http_x_lector_client $official_terminal {
  default 0;
  terminal 1;
}

map $http_authorization $bearer_request {
  default 0;
  ~*^Bearer\s+ 1;
}

map "$cli_user_agent:$official_terminal:$bearer_request:$uri" $blocked_cli_client {
  default 0;
  ~^1:0:0:/ebook/api/v1/health$ 0;
  ~^1:0:0: 1;
}

server {
  listen 80;
  listen [::]:80;
  server_name navydev.top rss.navydev.top crabtris.navydev.top obz.navydev.top;

  # Let's Encrypt ACME 验证
  include /etc/nginx/snippets/letsencrypt.conf;

  # 所有其他请求重定向到 HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}
