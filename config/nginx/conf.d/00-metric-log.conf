# 专用统计日志：保留所有请求，URI 不记录 query，来源仅记录 origin。
map $http_referer $metric_referer {
    default "-";
    ~^(?<metric_referrer_origin>https?://[^/?\#]+) $metric_referrer_origin;
}

map $host $metric_domain {
    default 0;
    navydev.top 1;
}

log_format navydev_metric '$remote_addr - - [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$metric_referer" "$http_user_agent" $request_time';
