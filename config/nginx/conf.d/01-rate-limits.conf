# 按 Nginx 规范化后的路径分类，编码字符和重复斜杠无法绕过后端额度。
# 旧 crabtris/obz 子域名仍代理 RSS 后端，使用同一后端额度。
map "$host:$uri" $navydev_request_class {
    default static;
    ~^(crabtris\.navydev\.top|obz\.navydev\.top): backend;
    ~^[^:]+:/ebook/api(/|$) backend;
    ~^[^:]+:/rss/backend(/|$) backend;
    ~^[^:]+:/rss/(docs|redoc|openapi\.json)$ backend;
    ~^[^:]+:/openapi\.json$ backend;
    ~^[^:]+:/metric/system/api(/|$) metric;
}

# 空键不计数：静态资源不会消耗 API 的额度。
map $navydev_request_class $navydev_backend_ip {
    default "";
    backend $binary_remote_addr;
}
map $navydev_request_class $navydev_backend_total {
    default "";
    backend $hostname;
}
map $navydev_request_class $navydev_metric_ip {
    default "";
    metric $binary_remote_addr;
}
map $navydev_request_class $navydev_metric_total {
    default "";
    metric $hostname;
}

# 页面返回中文提示页；API 保留可供现有前端显示的 JSON 错误结构。
map $navydev_request_class $navydev_limit_target {
    default @navydev_limit_page;
    backend @navydev_limit_api;
    metric @navydev_limit_api;
}

# 全部内容共用基础额度，后端与 Netdata API 叠加各自的额度。
limit_req_zone $binary_remote_addr zone=navydev_site_ip:1m rate=30r/s;
limit_req_zone $hostname zone=navydev_site_total:256k rate=200r/s;
limit_req_zone $navydev_backend_ip zone=navydev_backend_ip:1m rate=5r/s;
limit_req_zone $navydev_backend_total zone=navydev_backend_total:256k rate=30r/s;
limit_req_zone $navydev_metric_ip zone=navydev_metric_ip:1m rate=15r/s;
limit_req_zone $navydev_metric_total zone=navydev_metric_total:256k rate=60r/s;

# 防止音频合成、上传等慢请求在低请求速率下仍耗尽后端。
limit_conn_zone $navydev_backend_ip zone=navydev_backend_conn_ip:1m;
limit_conn_zone $navydev_backend_total zone=navydev_backend_conn_total:256k;
